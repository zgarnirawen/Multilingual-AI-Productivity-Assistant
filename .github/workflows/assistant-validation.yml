name: AI MLOps Validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  ai-validation:
    name: AI validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Run intent recognition regression
        run: npx tsx src/services/intentRecognitionRegressionCheck.ts

      - name: Run AI generalization tests
        run: npm run test:generalization

      - name: Run entity extraction tests
        run: npm run test:entities

      - name: Run connector contract tests
        run: npm run test:connectors

      - name: Run API connector tests
        run: npm run test:api-connectors

      - name: Run speech-to-text contract validation
        run: npx tsx src/services/speechToTextValidationCheck.ts
